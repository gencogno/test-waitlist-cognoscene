<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Cognoscene product demo — 3 layers, 3 minutes</title>
  <desc id="description">A cream editorial thumbnail with the Cognoscene mark, a two-line title, and icons for observer, rationalisation and prudency.</desc>
  <rect width="1280" height="800" fill="#EDEADE"/>
  <rect x="30" y="30" width="1220" height="740" rx="28" fill="none" stroke="#111111" stroke-width="3"/>
  <image href="cognoscene-mark.png" x="72" y="72" width="48" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="640" y="194" fill="#3B6D11" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">PRODUCT DEMO</text>
  <text x="640" y="337" fill="#111111" font-family="Times New Roman, Times, serif" font-size="126" font-weight="400" letter-spacing="-6" text-anchor="middle">3 layers.</text>
  <text x="640" y="453" fill="#111111" font-family="Times New Roman, Times, serif" font-size="126" font-weight="400" letter-spacing="-6" text-anchor="middle">3 minutes.</text>
  <text x="640" y="508" fill="#3B6D11" font-family="Arial, sans-serif" font-size="19" font-style="italic" font-weight="700" letter-spacing="-.4" text-anchor="middle">notice. pause. grow.</text>
  <g transform="translate(302 615)">
    <circle cx="0" cy="0" r="49" fill="#B8D878"/>
    <image href="icons/icon-observer.svg" x="-34" y="-34" width="68" height="68"/>
    <text x="0" y="94" fill="#111111" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">observer</text>
  </g>
  <g transform="translate(640 615)">
    <circle cx="0" cy="0" r="49" fill="#B8D878"/>
    <image href="icons/icon-rationalisation.svg" x="-34" y="-34" width="68" height="68"/>
    <text x="0" y="94" fill="#111111" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">rationalisation</text>
  </g>
  <g transform="translate(978 615)">
    <circle cx="0" cy="0" r="49" fill="#B8D878"/>
    <image href="icons/icon-prudency.svg" x="-34" y="-34" width="68" height="68"/>
    <text x="0" y="94" fill="#111111" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">prudency</text>
  </g>
</svg>
